name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend Lint
        run: |
          pip install uv
          cd backend
          uv sync --frozen --no-install-project
          uv run ruff check .

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Lint
        run: |
          cd frontend
          npm ci
          npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend Tests
        run: |
          pip install uv
          cd backend
          uv sync --frozen
          uv run pytest -v

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Tests
        run: |
          cd frontend
          npm ci
          npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker Images
        run: GIT_SHA=${{ github.sha }} docker compose build

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_VM_HOST }}
          username: ${{ secrets.OCI_DEPLOY_USER }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/saocs
            git fetch origin main
            git reset --hard origin/main
            if [ -f .env ]; then
              DOMAIN=$(grep -E '^DUCKDNS_DOMAIN=' .env | cut -d= -f2- | tr -d ' "\r\n')
              if [ -n "$DOMAIN" ] && [ "$DOMAIN" != "your-subdomain.duckdns.org" ]; then
                sed -i "s/DUCKDNS_DOMAIN/$DOMAIN/g" mosquitto/config/mosquitto.conf
              fi
            fi
            GIT_SHA=${{ github.sha }} docker compose build --no-cache
            GIT_SHA=${{ github.sha }} docker compose up -d --remove-orphans
            sleep 10
            docker compose exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" || exit 1
            echo "Deploy verified: ${{ github.sha }}"

      - name: Verify Deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_VM_HOST }}
          username: ${{ secrets.OCI_DEPLOY_USER }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/saocs
            DEPLOYED_SHA=$(docker compose exec -T backend python -c "import urllib.request,json; print(json.load(urllib.request.urlopen('http://localhost:8000/api/version'))['git_sha'])")
            if [ "$DEPLOYED_SHA" != "${{ github.sha }}" ]; then
              echo "DEPLOY VERIFICATION FAILED: expected ${{ github.sha }}, got $DEPLOYED_SHA"
              exit 1
            fi
            echo "Deploy SHA verified: $DEPLOYED_SHA"
