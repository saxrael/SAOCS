[project]
name = "saocs-backend"
version = "0.1.0"
description = "FastAPI backend for Smart Office Appliance Control System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiomqtt>=2.3.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "authlib>=1.4.0",
    "bcrypt>=4.2.0",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "itsdangerous>=2.2.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyjwt[crypto]>=2.10.0",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32.0",
    "websockets>=14.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
